<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>E-Money AI</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Onboarding Screen -->
    <div id="onboarding-screen">
        <h1 class="brand-title">E-Money AI</h1>
        <p class="brand-subtitle">Voice-to-Voice AI demo that runs <strong>entirely</strong> in your browser. 4+ GB of VRAM or Unified Memory and a Chromium-based browser are required.
        </p>

        <button id="btn-allow-mic" class="btn-primary">1. Allow Microphone Access</button>

        <button id="btn-init-models" class="btn-primary" disabled>2. Download &amp; Initialize Models</button>
        
        <!-- ADDED COMPATIBILITY TOGGLE -->
        <div
            style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center;">
            <input type="checkbox" id="compat-mode"
                style="width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;">
            <label for="compat-mode"
                style="font-size: 0.95rem; color: var(--text-muted); cursor: pointer;">Compatibility Mode (Use fp16
                instead of q4f16)</label>
        </div>

        <div class="console-container">
            <div class="console-header">Log</div>
            <div id="console-body" class="console-body">
                &gt; E-Money AI v1.0 by Breadmaster101
            </div>
        </div>
    </div>

    <!-- Main Visualizer UI -->
    <div id="main-screen">
        <div class="visualizer-wrapper">
            <div id="visualizer-circle"></div>
        </div>
        <div id="ptt-label" class="ptt-text">Hold 'P' to talk</div>
    </div>

    <!-- Settings FAB -->
    <button id="settings-fab" class="settings-fab" style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
        </svg>
    </button>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="close-settings-btn" class="icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="input-group">
                <label for="extVoiceSelect">TTS Voice</label>
                <select id="extVoiceSelect" class="custom-select">
                    <option value="af_heart">af_heart (American Female)</option>
                    <option value="af_alloy">af_alloy (American Female)</option>
                    <option value="af_aoede">af_aoede (American Female)</option>
                    <option value="af_bella">af_bella (American Female)</option>
                    <option value="af_jessica">af_jessica (American Female)</option>
                    <option value="af_kore">af_kore (American Female)</option>
                    <option value="af_nicole">af_nicole (American Female)</option>
                    <option value="af_nova">af_nova (American Female)</option>
                    <option value="af_river">af_river (American Female)</option>
                    <option value="af_sarah">af_sarah (American Female)</option>
                    <option value="af_sky">af_sky (American Female)</option>
                    <option value="am_adam">am_adam (American Male)</option>
                    <option value="am_echo">am_echo (American Male)</option>
                    <option value="am_eric">am_eric (American Male)</option>
                    <option value="am_fenrir">am_fenrir (American Male)</option>
                    <option value="am_liam">am_liam (American Male)</option>
                    <option value="am_michael">am_michael (American Male)</option>
                    <option value="am_onyx" selected>am_onyx (American Male)</option>
                    <option value="am_puck">am_puck (American Male)</option>
                    <option value="am_santa">am_santa (American Male)</option>
                    <option value="bf_alice">bf_alice (British Female)</option>
                    <option value="bf_emma">bf_emma (British Female)</option>
                    <option value="bf_isabella">bf_isabella (British Female)</option>
                    <option value="bf_lily">bf_lily (British Female)</option>
                    <option value="bm_daniel">bm_daniel (British Male)</option>
                    <option value="bm_fable">bm_fable (British Male)</option>
                    <option value="bm_george">bm_george (British Male)</option>
                    <option value="bm_lewis">bm_lewis (British Male)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="extSpeedSelect">Speech Speed (<span id="extSpeedValue">1.3</span>x)</label>
                <input type="range" id="extSpeedSelect" class="custom-range" min="0.5" max="2.0" step="0.1" value="1.3">
            </div>

            <div class="input-group">
                <label for="extVolumeSelect">Volume (<span id="extVolumeValue">100</span>%)</label>
                <input type="range" id="extVolumeSelect" class="custom-range" min="0" max="1" step="0.01" value="1.0">
            </div>

            <div class="panel-title">Appearance</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 0.9rem; color: var(--text-muted);">Toggle Light/Dark Theme</span>
                <button id="theme-toggle-btn" class="icon-btn">
                    <svg id="theme-icon-light" style="display: none;" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg id="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </div>

            <div class="panel-title">Storage</div>
            <button id="btn-delete-models" class="btn-danger">Delete Downloaded Models</button>
        </div>
    </div>


    <!-- HIDDEN ORIGINAL UI Elements required to prevent breaking original logic bindings -->
    <div id="hidden-original-ui">
        <div class="status-box">
            <span id="status"></span>
            <span id="micStatus"></span>
        </div>
        <div>
            <select id="voiceSelect"></select>
            <input type="range" id="speedSelect">
            <span id="speedValue">1.3</span>
            <button id="loadBtn">Load Models</button>
        </div>
        <div id="chatHistoryContainer"></div>
        <div class="input-area">
            <textarea id="userInput"></textarea>
            <button id="sendBtn"></button>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- Main Application Script -->
    <script src="app.js" type="module"></script>
</body>

</html>
